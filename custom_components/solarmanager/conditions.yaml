is_surplus_present:
  target:
    device:
      integration: solarmanager
  fields:
    threshold:
      required: true
      default: 0
      selector:
        number:
          mode: box
          unit_of_measurement: W
    for:
      required: true
      default: "00:02:00"
      selector:
        duration:
is_power_above_generator_share:
  target:
    device:
      integration: solarmanager
  fields:
    source:
      required: true
      default: feed_in
      selector:
        select:
          options:
            - feed_in
            - production
          translation_key: power_source
    percent:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 100
          mode: box
          unit_of_measurement: "%"
    for:
      required: true
      default: "00:02:00"
      selector:
        duration:
is_curtailment_expected_today:
  target:
    device:
      integration: solarmanager
  fields:
    percent:
      required: true
      default: 60
      selector:
        number:
          min: 1
          max: 100
          mode: box
          unit_of_measurement: "%"
    band:
      required: true
      default: expected
      selector:
        select:
          options:
            - expected
            - max
          translation_key: forecast_band
